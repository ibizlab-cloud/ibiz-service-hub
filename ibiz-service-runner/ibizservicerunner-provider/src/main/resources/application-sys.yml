#缓存、数据源
spring:
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    username: plm
    password: 'plm@2024'
    url: jdbc:mysql://${mysql.host:mysql}:${mysql.port:3306}/plm?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&useOldAliasMetadataBehavior=true&serverTimezone=Asia/Shanghai&allowMultiQueries=true&serverTimezone=GMT%2B8&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver
    isSyncDBSchema: false
    defaultSchema: plm
    dynamic:
      datasource:
        master:
          username: ${spring.datasource.username}
          password: ${spring.datasource.password}
          url: ${spring.datasource.url}
          driver-class-name: ${spring.datasource.driver-class-name}
  #启动是否加载liquibase构建表结构
  liquibase:
    enabled: false

# Mybatis-plus配置
mybatis-plus:
  global-config:
    refresh-mapper: true
    db-config:
      # 全局逻辑已删除默认值
      logic-delete-value: 0
      # 全局逻辑未删除默认值
      logic-not-delete-value: 1
#   mapper-locations: classpath*:/mapper/*/*/*.xml
  configuration:
    jdbc-type-for-null: 'null'
    map-underscore-to-camel-case: false
    call-setters-on-nulls: true
  type-handlers-package: net.ibizsys.central.plugin.mybatisplus.spring.typehandler

 
#Log配置
logging:
  level:
    net.ibizsys.central.database.mybatis: INFO
    org.springframework.boot.autoconfigure: ERROR



### 启用Gzip压缩
server:
  max-http-header-size: 100KB
  compression:
    enabled: true
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 10240



